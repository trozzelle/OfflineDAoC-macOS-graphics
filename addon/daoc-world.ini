; daoc-world ReShade add-on settings, read when the add-on loads (restart the client after a change).
; The log, daoc-world.log, is written beside this file.

; 1: run the ReShade effects before the game draws its UI (the first orthographic back-buffer draw after the 3D
; scene), so the UI keeps its own colours. Character select draws 3D models, so its effects also run before its UI;
; screens with no perspective back-buffer draw (login, loading) get the effects at Present. 0: always at Present.
effects_before_ui = 1

; Size of the water reflection render target: 1 keeps the game's 512x512; 2 makes it 1024x1024, 4 makes it 2048x2048.
; Shipped at 2: the 1024x1024 reflection was checked in game.
reflection_scale = 2
